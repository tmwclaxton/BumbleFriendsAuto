name: Deploy lgspipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tmwclaxton/bumblefriendsauto
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: admin.grantgunner.org
          username: gunnergrant
          key: ${{ secrets.LGPIPELINE_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/lgspipeline
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u tmwclaxton --password-stdin
            docker compose pull
            docker compose up -d
            sleep 2
            curl -sf -u "${{ secrets.LGPIPELINE_BASIC_AUTH }}" http://127.0.0.1:8765/api/health
            echo "deploy ok"
