<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LeadsAuto</title>
<style>
  :root {
    --bg: #111114;
    --panel: #1b1b21;
    --line: #2c2c34;
    --text: #f2efe8;
    --muted: #9a9588;
    --you: #e8c547;
    --li: #7eb8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 "Avenir Next", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: min(720px, 100%);
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 22px;
    min-height: 160px;
  }
  a.card:hover { border-color: #4a4a56; background: #22222a; }
  a.card h2 { margin: 0 0 8px; font-size: 20px; }
  a.card.bumble h2 { color: var(--you); }
  a.card.li h2 { color: var(--li); }
  a.card p { margin: 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>LeadsAuto</h1>
  <p class="sub">Toby / Pixel and Archie / Galaxy — pick a channel</p>
  <div class="cards">
    <a class="card bumble" href="/bumble">
      <h2>Bumble Friends</h2>
      <p>Inbox, drafts, New friends, swipe desk. Same two-phone pipeline as before.</p>
    </a>
    <a class="card li" href="/linkedin">
      <h2>LinkedIn</h2>
      <p>Messaging list only. Slow scans, feed cover first. No drafts or CRM yet.</p>
    </a>
  </div>
</body>
</html>
