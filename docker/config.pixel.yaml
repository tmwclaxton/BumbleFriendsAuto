# Local production config for the Pixel + Galaxy on admin.grantgunner.org
serial: 29081FDH200GZ8
package: com.bumblebff.app
phones:
  toby:
    label: Toby
    device: pixel
    serial: 29081FDH200GZ8
    notes: Pixel ~1080x2400
  archie:
    label: Archie
    device: galaxy
    serial: ce01171185a334920c
    notes: Galaxy S7 SM-G930F (herolte) — set GALAXY_UNLOCK_PIN in .env
bring_to_foreground: true
db_path: data/friends.db

messenger:
  template: >-
    Hi {name}, I'm putting together a wee group for hiking / board games / sports.
    Does that sound like something you would be interested in?
  max_messages: 20
  delay_min: 2.5
  delay_max: 5.0
  type_pause: 0.8
