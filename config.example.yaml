# Optional ADB serial (Honor Pro or Pixel). Env SERIAL / PIXEL_SERIAL overrides.
# serial: 29081FDH200GZ8

# Bumble Friends / BFF package (main Bumble dating app is com.bumble.app)
package: com.bumblebff.app

# Session limits
max_swipes: 30
like_ratio: 1.0          # 1.0 = always like; 0.8 = like ~80% of the time

# Hinge-style ethnicity allowlist for the swipe deck.
# Bumble Friends (UK) has no Discover ethnicity picker — this reads a
# self-declared chip / Ethnicity row on the card, then likes or passes.
# Empty include = off. if_missing: allow (like anyway) or pass.
# buckets: white, black, east asian, south asian, southeast asian, asian,
# hispanic, middle eastern, native american, pacific islander, mixed, other
filters:
  ethnicity:
    include: []
    if_missing: allow
  # Live vision on each People card: men → white / east asian / southeast asian only
  # (pass black + south asian / Indian). Women → like unless crazy=yes.
  swipe_vision:
    enabled: true
    men_include: [white, east_asian, southeast_asian]
    men_exclude: [black, south_asian]
    men_if_missing: pass

# NanoGPT vision for inbox ethnicity tags (Guess from photos).
# Prefer NANOGPT_API_KEY in the environment — do not commit a real key.
nanogpt:
  api_key: ""
  vision_model: google/gemini-2.5-flash
  chat_model: openai/gpt-5.6-sol

# Obsidian MCP on admin.grantgunner.org (events + run prompt for auto-drafts).
# Prefer OBSIDIAN_MCP_TOKEN / OBSIDIAN_MCP_URL in the environment.
obsidian:
  mcp_url: http://127.0.0.1:18080/mcp
  mcp_token: ""
  events_note: LGS/Events.md
  run_prompt_note: LGS/Run prompt.md
  people_folder: LGS/People

# Auto-draft replies with GPT Sol when a new incoming turn is captured.
draft:
  enabled: true
  max_attempts: 5

# Delay between profiles after a decision (seconds), sampled uniformly
delay_min: 2.5
delay_max: 7.0

# Spend time looking through each profile before liking/passing.
# Each profile randomly picks a style (photos_first, scroll_first, interleave,
# photos_only, scroll_only, skim, deep) so taps/scrolls aren't identical.
browse:
  enabled: true
  look_min: 1.8          # stare at a photo
  look_max: 4.5
  photo_taps_min: 0      # 0 allowed — some styles skip gallery taps
  photo_taps_max: 4
  back_photo_chance: 0.28
  scrolls_min: 0         # 0 allowed — some styles barely open the bio
  scrolls_max: 3
  read_min: 1.5          # pause after each scroll ("reading")
  read_max: 4.0
  scroll_back_chance: 0.35
  pre_swipe_min: 0.5
  pre_swipe_max: 1.4
  photo_tap_x_right: 0.78
  photo_tap_x_left: 0.22
  photo_tap_y: 0.42      # keep above compliment / SuperSwipe buttons
  scroll_x: 0.50
  scroll_y_start: 0.72
  scroll_y_end: 0.38
  scroll_duration_ms_min: 350
  scroll_duration_ms_max: 650
  jitter: 0.02

# Swipe region as fractions of screen width/height (0.0–1.0)
# Start near the left/center of the card; end near the right edge for a like.
swipe:
  start_x: 0.22
  start_y: 0.50
  end_x_like: 0.92
  end_x_pass: 0.08
  end_y: 0.50
  duration_ms_min: 180
  duration_ms_max: 280
  jitter: 0.02           # random offset applied to each coordinate (fraction of screen)

# Optional: bring Bumble to foreground at start (does not log you in)
bring_to_foreground: true

# Where dump_ui writes artifacts
dump_dir: dumps

# SQLite store for people + chat progress (python -m src.sync_chats / src.store)
db_path: data/friends.db

# Message New friends circles on the Chats tab (python -m src.messenger)
messenger:
  template: >-
    Hi {name}, I'm putting together a wee group for hiking / board games / sports.
    Does that sound like something you would be interested in?
  max_messages: 20
  delay_min: 2.5
  delay_max: 5.0
  type_pause: 0.8
